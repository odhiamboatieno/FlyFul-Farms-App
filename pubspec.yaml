name: flyful_farms
description: "Flyful Farms — mobile app for insect farming management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # State management
  provider: ^6.1.4

  # Networking
  dio: ^5.8.0

  # Icons
  font_awesome_flutter: ^11.0.0

  # Storage
  flutter_secure_storage: ^9.2.4

  # Routing
  go_router: ^17.3.0

  # DI
  get_it: ^8.0.3

  # Network / connectivity
  connectivity_plus: ^6.1.5

  # Local database
  drift: ^2.6.2
  sqlite3_flutter_libs: ^0.5.4
  path_provider: ^2.1.4
  path: ^1.9.0

  # Utilities
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.6.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
